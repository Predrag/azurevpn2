<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img"
  aria-label="AzureVPN inactive icon">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#00A0F0" />
      <stop offset="1" stop-color="#0063C8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#004a89" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#g)" />

  <!-- Soft inner highlight -->
  <ellipse cx="210" cy="180" rx="120" ry="70" fill="#FFFFFF" opacity="0.06" />

  <!-- Shield -->
  <g transform="translate(0,12)" filter="url(#shadow)">
    <path
      d="M256 150c-58 0-104 36-104 80v64c0 78 64 120 104 140 40-20 104-62 104-140v-64c0-44-46-80-104-80z"
      fill="#fff" />
    <path
      d="M256 162c-51 0-92 32-92 70v56c0 68 56 106 92 124 36-18 92-56 92-124v-56c0-38-41-70-92-70z"
      fill="url(#g)" opacity="0.96" />
  </g>

  <!-- White lock/keyhole -->
  <g transform="translate(0,0)">
    <rect x="238" y="220" width="40" height="56" rx="8" fill="#fff" opacity="0.98" />
    <circle cx="258" cy="244" r="8" fill="#0063C8" />
    <rect x="250" y="272" width="16" height="18" rx="3" fill="#0063C8" />
  </g>

  <!-- Stylized cloud/azure accent at top-right -->
  <g transform="translate(-10,-20) scale(0.9)">
    <path
      d="M372 150c-18 0-34 10-42 25-6-7-15-11-25-11-19 0-34 15-34 34 0 1 0 2 0 3-22 1-39 20-39 43 0 24 19 43 43 43h118c24 0 43-19 43-43 0-23-17-42-39-43-1-23-21-40-44-40z"
      fill="#ffffff" opacity="0.95" />
    <path
      d="M340 172c-9 0-17 6-20 14-3-2-6-3-10-3-9 0-16 7-16 16 0 0 0 1 0 1-10 0-18 9-18 19 0 11 9 19 20 19h55c11 0 20-8 20-19 0-9-7-17-16-19-1-9-10-16-19-16z"
      fill="#E8F6FF" opacity="0.9" />
  </g>

  <!-- RED SQUARE indicator — bottom-right corner -->
  <rect x="305" y="305" width="240" height="240" rx="28" fill="#E03030" stroke="#A02020"
    stroke-width="6" />
  <line x1="360" y1="360" x2="445" y2="445" stroke="#fff" stroke-width="18" stroke-linecap="round" />
  <line x1="445" y1="360" x2="360" y2="445" stroke="#fff" stroke-width="18" stroke-linecap="round" />

  <title>AzureVPN Inactive</title>
  <desc>AzureVPN icon with red inactive indicator.</desc>
</svg>